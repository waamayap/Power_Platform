              );

              Refresh(BancoProyectos);

              If(
                  IsEmpty(Errors(BancoProyectos, varSaved2)),
                  Notify("Guardado. ID: " & Text(varSaved2.ID), NotificationType.Success);
                  Navigate(MOD_SGPROYECTOS, ScreenTransition.None),
                  Notify(First(Errors(BancoProyectos, varSaved2)).Message, NotificationType.Error)
              )
