App:
  Properties:
    OnStart: |+
      =Set(varDropdownModulo, false);
      ClearCollect(colFases, Fases);
      ClearCollect(colSGP, SistemaGestionProyectos);
      ClearCollect(
          colProyectos,
          ForAll(
              RepositorioProyectos,
              With(
                  {NRE: 'Numero radicado entrada'},
                  {
                      NumeroRadicado: NRE,
                      NombreProyecto: 'Nombre del proyecto',
                      NumeroContrato: 'Número de contrato',
                      Comuna: 'Comuna - Corregimiento'.Value,
                      FaseCalculada: LookUp(
                          colFases,
                          FaseID = LookUp(colSGP, 'Numero radicado entrada' = NRE).FaseID
                      ).'Nombre de la Fase'.Value,
                      EstadoCalculado: LookUp(
                          colFases,
                          'Numero radicado entrada' = NRE &&
                          FaseID = LookUp(colSGP, 'Numero radicado entrada' = NRE).FaseID
                      ).Estado.Value
                  }
              )
          )
      );
      ClearCollect(colComunasFiltro, [{Opcion: "Todas las comunas"}]);
      ClearCollect(colFasesFiltro, [{Opcion: "Todas las fases"}]);
      ClearCollect(colEstadosFiltro, [{Opcion: "Todos los estados"}])
    Theme: =PowerAppsTheme
