            OnSelect: |-
              =IfError(
                  Set(
                      varSaved2,
                      Patch(
                          BancoProyectos,
                          varFormDataPri,
                          FormDatosGeneralesPri.Updates,
                          FormComponenteTecnico.Updates,
                          FormPriComponenteJuridico.Updates,
                          FormPriComponenteAmbiental.Updates,
                          FormPriComponenteAdministrativo.Updates
                      )
                  );

                  Refresh(BancoProyectos);

                  Set(
                      varFormDataPri,
                      LookUp(
                          BancoProyectos,
                          ID = varSaved2.ID
                      )
                  );

                  ResetForm(FormDatosGeneralesPri);
                  ResetForm(FormComponenteTecnico);
                  ResetForm(FormPriComponenteJuridico);
                  ResetForm(FormPriComponenteAmbiental);
                  ResetForm(FormPriComponenteAdministrativo);

                  Notify(
                      "Guardado y actualizado. ID: " & Text(varSaved2.ID),
                      NotificationType.Success
                  ),

                  Notify(
                      FirstError.Message,
                      NotificationType.Error
                  )
              )
            PaddingBottom: =2.82
            PaddingLeft: =2.82
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
