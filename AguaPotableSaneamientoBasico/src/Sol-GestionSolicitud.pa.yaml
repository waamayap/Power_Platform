      - Button6:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =ColorValue("#1a3a5c")
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  FormDatosGenerales.Valid && FormGestionSolicitud.Valid && FormViabilidad.Valid,

                  Set(
                      varEsNuevo,
                      IsBlank(varFormData) || IsBlank(varFormData.ID)
                  );

                  Set(
                      varOrigenRadicado,
                      Coalesce(DataCardValue47.Selected.Value, "")
                  );

                  If(
                      varEsNuevo,

                      If(
                          Lower(varOrigenRadicado) = "mercurio" && IsBlank(Trim(DataCardValue49.Text)),

                          Notify(
                              "Como el origen del radicado es Mercurio, debes ingresar el número de radicado manualmente.",
                              NotificationType.Warning
                          ),

                          /* Crear registro */
                          IfError(
                              Set(
                                  varSaved,
                                  Patch(
                                      Solicitudes,
                                      Defaults(Solicitudes),
                                      FormDatosGenerales.Updates,
                                      FormGestionSolicitud.Updates,
                                      FormViabilidad.Updates
                                  )
                              );

                              Set(
                                  varSolicitudIDGenerado,
                                  Text(varSaved.ID, "0000")
                              );

                              Set(
                                  varRadicadoGenerado,
                                  Text(Today(), "[$-en-US]yyyymmdd") & varSolicitudIDGenerado
                              );

                              Set(
                                  varSaved,
                                  Patch(
                                      Solicitudes,
                                      LookUp(Solicitudes, ID = varSaved.ID),
                                      If(
                                          Lower(varOrigenRadicado) = "mercurio",
                                          {
                                              SolicitudID: varSolicitudIDGenerado
                                          },
                                          {
                                              SolicitudID: varSolicitudIDGenerado,
                                              'Numero radicado entrada': varRadicadoGenerado
                                          }
                                      )
                                  )
                              );

                              Refresh(Solicitudes);

                              Set(
                                  varFormData,
                                  LookUp(Solicitudes, ID = varSaved.ID)
                              );

                              Notify(
                                  If(
                                      Lower(varOrigenRadicado) = "mercurio",
                                      "Solicitud guardada correctamente con consecutivo " & varSolicitudIDGenerado,
                                      "Solicitud guardada correctamente con radicado " & varRadicadoGenerado
                                  ),
                                  NotificationType.Success
                              );

                              Navigate(
                                  MOD_SGPROYECTOS,
                                  ScreenTransition.Fade
                              ),

                              Notify(
                                  "Error al crear la solicitud: " & FirstError.Message,
                                  NotificationType.Error,
                                  10000
                              )
                          )
                      ),

                      /* Editar registro existente */
                      If(
                          IsBlank(varFormData) || IsBlank(varFormData.ID),

                          Notify(
                              "No se encontró el ID de la solicitud para editar. Vuelve a entrar desde el lápiz.",
                              NotificationType.Error
                          ),

                          IfError(
                              Set(
                                  varSaved,
                                  Patch(
                                      Solicitudes,
                                      LookUp(Solicitudes, ID = varFormData.ID),
                                      FormDatosGenerales.Updates,
                                      FormViabilidad.Updates
                                  )
                              );

                              SubmitForm(FormGestionSolicitud),

                              Notify(
                                  "Error al actualizar la solicitud: " & FirstError.Message,
                                  NotificationType.Error,
                                  10000
                              )
                          )
                      )
                  ),

                  Notify(
                      "Revisa la configuración de los formularios",
                      NotificationType.Warning
                  )
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13.54
            Text: ="Guardar"
            Width: =120
            X: =609
            Y: =600
